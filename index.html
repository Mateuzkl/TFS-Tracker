<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>TFS Tracker • creature-sharedptr-final</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #0a0a14; --bg-secondary: #111122; --bg-card: rgba(255,255,255,0.03);
    --bg-card-hover: rgba(255,255,255,0.08); --glass: rgba(17,17,34,0.6);

  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary);
    min-height: 100vh; overflow-x: auto; position: relative; line-height: 1.5; }
  body::before { content: ''; position: fixed; inset: -50%;
    background: radial-gradient(ellipse at 15% 25%, rgba(108,92,231,0.12) 0%, transparent 55%),

  .orb { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.35; z-index: 0; pointer-events: none; animation: orbFloat 20s ease-in-out infinite; }

  .orb-3 { width: 280px; height: 280px; background: var(--build); top: 45%; left: 60%; animation-delay: -14s; }
  @keyframes orbFloat { 0%,100%{transform:translate(0,0)rotate(0deg)} 33%{transform:translate(80px,40px)rotate(120deg)} 66%{transform:translate(-40px,60px)rotate(240deg)} }
  .grid-bg { position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 40px 40px; z-index: 0; pointer-events: none; }
  .header { position: sticky; top: 0; z-index: 100; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,20,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }

  .stat-progress .dot { background: var(--progress); box-shadow: 0 0 12px var(--progress-glow); }

  .btn-ghost:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: rgba(255,255,255,0.15); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--bg-primary); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s var(--ease); margin-left: -8px; }
  .avatar:first-child { margin-left: 0; }
  .avatar:hover { transform: translateY(-3px) scale(1.05); z-index: 2; }
  .avatar-1 { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
  .avatar-2 { background: linear-gradient(135deg, #fd79a8, #fdcb6e); }
  .avatar-3 { background: linear-gradient(135deg, #00cec9, #55efc4); }
  .board { position: relative; z-index: 10; padding: 24px 32px; display: flex; gap: 20px; overflow-x: auto; min-height: calc(100vh - 90px); align-items: flex-start; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
  .board::-webkit-scrollbar { height: 6px; }

  .board::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  .column { min-width: 340px; max-width: 340px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius); backdrop-filter: blur(24px); display: flex; flex-direction: column; max-height: calc(100vh - 130px); transition: all 0.3s var(--ease); animation: columnEnter 0.5s var(--ease) backwards; }
  .column:nth-child(1){animation-delay:0.1s} .column:nth-child(2){animation-delay:0.15s} .column:nth-child(3){animation-delay:0.2s} .column:nth-child(4){animation-delay:0.25s} .column:nth-child(5){animation-delay:0.3s} .column:nth-child(6){animation-delay:0.35s}

  .column-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; background: inherit; border-radius: var(--radius) var(--radius) 0 0; z-index: 5; }
  .column-title-area { display: flex; align-items: center; gap: 12px; }

  @keyframes badgePulse { 0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,0)} 50%{opacity:0.8;transform:scale(0.95);box-shadow:0 0 12px currentColor} }
  .column-title { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
  .column-count { background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; }
  .column-progress { height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; margin-top: 8px; overflow: hidden; }

  .col-btn { width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s var(--ease); font-size: 15px; }
  .col-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }

  .add-card-btn { margin: 0 12px 12px; padding: 12px; border-radius: var(--radius-sm); border: 1px dashed var(--glass-border); background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.25s var(--ease); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .add-card-btn:hover { border-color: var(--smartptr); color: var(--smartptr); background: rgba(108,92,231,0.06); }

  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }

    const columnEl = document.createElement('div'); columnEl.className = 'column'; columnEl.dataset.columnId = col.id; columnEl.style.animationDelay = `${colIndex * 0.05}s`;
    const done = col.cards.filter(c => c.status === 'done').length; const total = col.cards.length; const progressPct = Math.round((done / total) * 100);
    columnEl.innerHTML = `<div class="column-header"><div class="column-title-area"><div class="column-badge" style="background:${col.color};color:${col.color}"></div><span class="column-title">${col.title}</span><span class="column-count">${done}/${total}</span></div><div class="column-actions"><button class="col-btn" title="Adicionar card" onclick="showAddForm('${col.id}')">＋</button><button class="col-btn" title="Filtrar">🔍</button></div></div><div class="filter-bar"><button class="filter-btn active" data-filter="all">Todos</button><button class="filter-btn" data-filter="done">✅</button><button class="filter-btn" data-filter="progress">🔄</button><button class="filter-btn" data-filter="pending">⏳</button></div><div class="column-progress"><div class="column-progress-bar" style="width:${progressPct}%"></div></div><div class="column-cards" id="cards-${col.id}" data-column="${col.id}">${col.cards.map((card, i) => renderCard(card, i)).join('')}</div><button class="add-card-btn" id="addBtn-${col.id}" onclick="showAddForm('${col.id}')"><span>＋</span> Adicionar card</button><div class="add-card-form" id="form-${col.id}"><textarea placeholder="Descreva a tarefa técnica..." id="textarea-${col.id}"></textarea><div class="add-card-form-actions"><button class="btn btn-primary" onclick="addCard('${col.id}')">Adicionar</button><button class="btn btn-ghost" onclick="hideAddForm('${col.id}')">Cancelar</button></div></div>`;
    board.appendChild(columnEl);
    columnEl.querySelectorAll('.filter-btn').forEach(btn => { btn.onclick = (e) => { columnEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); filterColumnCards(col.id, btn.dataset.filter); }; });
  });
  const addCol = document.createElement('div'); addCol.className = 'add-column'; addCol.onclick = addColumn; addCol.innerHTML = `<div class="add-column-content"><div class="add-column-icon">＋</div><div class="add-column-text">Adicionar categoria</div></div>`; board.appendChild(addCol); setupDragAndDrop(); updateStats();
}
function renderCard(card, index) {
  const tagsHtml = card.tags.map(t => `<span class="tag tag-${t}">${t}</span>`).join('');
  const progressClass = card.status === 'done' ? 'done' : card.status === 'progress' ? 'progress' : 'pending';
  const progressWidth = card.status === 'done' ? 100 : card.status === 'progress' ? 60 : 20;
  return `<div class="card" draggable="true" data-card-id="${card.id}" style="animation-delay:${index * 0.03}s" onclick="openModal('${card.id}')"><div class="card-status ${card.status}"></div><div class="card-header"><div class="card-title">${card.title}</div><span class="card-id">${card.meta?.commits || 'TFS'}</span></div><div class="card-desc">${card.desc}</div><div class="card-tags">${tagsHtml}</div><div class="card-progress"><div class="card-progress-bar ${progressClass}" style="width:${progressWidth}%"></div></div><div class="card-meta"><div class="card-meta-left">${card.meta?.lines ? `<span class="meta-item">📝 ${card.meta.lines}</span>` : ''}${card.meta?.perf ? `<span class="meta-item">⚡ ${card.meta.perf}</span>` : ''}</div><button class="card-check ${card.status === 'done' ? 'checked' : ''}" onclick="event.stopPropagation();toggleCardStatus('${card.id}', this)" title="${card.status === 'done' ? 'Concluído' : 'Marcar como concluído'}">${card.status === 'done' ? '✓' : ''}</button></div></div>`;
}
function setupDragAndDrop() {
  document.querySelectorAll('.card').forEach(card => { card.addEventListener('dragstart', handleDragStart); card.addEventListener('dragend', handleDragEnd); });
  document.querySelectorAll('.column-cards').forEach(col => { col.addEventListener('dragover', handleDragOver); col.addEventListener('dragenter', handleDragEnter); col.addEventListener('dragleave', handleDragLeave); col.addEventListener('drop', handleDrop); });
}
function handleDragStart(e) { draggedCard = this; draggedCardId = this.dataset.cardId; sourceColumn = this.closest('.column-cards').dataset.column; this.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', draggedCardId); }
function handleDragEnd() { this.classList.remove('dragging'); document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over')); document.querySelectorAll('.drag-placeholder').forEach(p => p?.remove()); draggedCard = null; }
function handleDragOver(e) { e.preventDefault(); const column = this; const afterElement = getDragAfterElement(column, e.clientY); let placeholder = column.querySelector('.drag-placeholder'); if (!placeholder) { placeholder = document.createElement('div'); placeholder.className = 'drag-placeholder'; } if (afterElement) { column.insertBefore(placeholder, afterElement); } else { column.appendChild(placeholder); } }
function handleDragEnter(e) { e.preventDefault(); this.closest('.column').classList.add('drag-over'); }
function handleDragLeave(e) { const rect = this.getBoundingClientRect(); if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) { this.closest('.column').classList.remove('drag-over'); } }
function handleDrop(e) { e.preventDefault(); const targetColumnId = this.dataset.column; const cardId = e.dataTransfer.getData('text/plain'); let sourceCol = columnsData.find(c => c.id === sourceColumn); let targetCol = columnsData.find(c => c.id === targetColumnId); let cardIndex = sourceCol.cards.findIndex(c => c.id === cardId); let card = sourceCol.cards.splice(cardIndex, 1)[0]; const afterElement = getDragAfterElement(this, e.clientY); if (afterElement) { const afterCardId = afterElement.dataset.cardId; const afterIndex = targetCol.cards.findIndex(c => c.id === afterCardId); targetCol.cards.splice(afterIndex, 0, card); } else { targetCol.cards.push(card); } if (targetColumnId === 'smartpointers' && card.status === 'done') { launchConfetti(); showToast('Smart pointer migrado! 🎉', 'success'); } renderBoard(); }
function getDragAfterElement(container, y) { const elements = [...container.querySelectorAll('.card:not(.dragging)')]; return elements.find(el => { const rect = el.getBoundingClientRect(); return y < rect.top + rect.height / 2; }); }
function showAddForm(columnId) { document.getElementById(`form-${columnId}`).classList.add('active'); document.getElementById(`addBtn-${columnId}`).style.display = 'none'; document.getElementById(`textarea-${columnId}`).focus(); }
function hideAddForm(columnId) { document.getElementById(`form-${columnId}`).classList.remove('active'); document.getElementById(`addBtn-${columnId}`).style.display = 'flex'; }
function addCard(columnId) { const textarea = document.getElementById(`textarea-${columnId}`); const title = textarea.value.trim(); if (!title) return; const col = columnsData.find(c => c.id === columnId); const newCard = { id: 'c' + Date.now(), title: title, desc: '', status: 'pending', tags: ['cpp'], file: 'src/', code: '// Novo código aqui', checklist: [], meta: {} }; col.cards.push(newCard); hideAddForm(columnId); textarea.value = ''; renderBoard(); showToast('Card criado!', 'success'); }
function toggleCardStatus(cardId, btn) { let card = null; columnsData.forEach(col => { const found = col.cards.find(c => c.id === cardId); if (found) card = found; }); if (!card) return; const wasDone = card.status === 'done'; card.status = wasDone ? 'progress' : 'done'; btn.classList.toggle('checked'); btn.innerHTML = card.status === 'done' ? '✓' : ''; if (card.status === 'done' && !wasDone) { const cardEl = btn.closest('.card'); cardEl.classList.add('completing'); setTimeout(() => cardEl.classList.remove('completing'), 500); launchConfetti(); showToast('Tarefa concluída! 🎉', 'success'); } renderBoard(); }
function filterColumnCards(columnId, filter) { const cardsContainer = document.getElementById(`cards-${columnId}`); cardsContainer.querySelectorAll('.card').forEach(card => { const cardId = card.dataset.cardId; let card = null; columnsData.find(col => { const found = col.cards.find(c => c.id === cardId); if (found) card = found; return found; }); if (filter === 'all' || card?.status === filter) { card.style.display = ''; } else { card.style.display = 'none'; } }); }
function openModal(cardId) { let card = null; columnsData.forEach(col => { const found = col.cards.find(c => c.id === cardId); if (found) { card = found; } }); if (!card) return; currentModalCard = card; document.getElementById('modalTitle').textContent = card.title; document.getElementById('modalSubtitle').textContent = `${card.file} • ${card.status.toUpperCase()}`; document.getElementById('modalDescription').value = card.desc; document.getElementById('modalCode').textContent = card.code || '// Sem código relacionado'; const checklistHtml = (card.checklist || []).map((item, i) => `<div class="checklist-item"><button class="checklist-check ${item.done ? 'checked' : ''}" onclick="toggleChecklistItem(${i})">✓</button><span class="checklist-text ${item.done ? 'done' : ''}">${item.text}</span></div>`).join('') || '<div style="color:var(--text-muted);font-size:13px">Nenhum item no checklist</div>'; document.getElementById('modalChecklist').innerHTML = checklistHtml; document.getElementById('modalOverlay').classList.add('active'); }
function closeModal(event) { if (event && event.target !== document.getElementById('modalOverlay')) return; document.getElementById('modalOverlay').classList.remove('active'); if (currentModalCard) { currentModalCard.desc = document.getElementById('modalDescription').value; renderBoard(); } }
function toggleChecklistItem(index) { if (!currentModalCard?.checklist?.[index]) return; currentModalCard.checklist[index].done = !currentModalCard.checklist[index].done; const checklistHtml = currentModalCard.checklist.map((item, i) => `<div class="checklist-item"><button class="checklist-check ${item.done ? 'checked' : ''}" onclick="toggleChecklistItem(${i})">✓</button><span class="checklist-text ${item.done ? 'done' : ''}">${item.text}</span></div>`).join(''); document.getElementById('modalChecklist').innerHTML = checklistHtml; const allDone = currentModalCard.checklist.every(c => c.done); if (allDone && currentModalCard.status !== 'done') { currentModalCard.status = 'done'; showToast('Checklist completo! 🎉', 'success'); renderBoard(); } }
function addColumn() { const name = prompt('Nome da nova categoria:'); if (!name) return; const colors = ['var(--smartptr)', 'var(--build)', 'var(--lua)', 'var(--perf)', 'var(--protocol)', 'var(--security)']; const newCol = { id: 'col_' + Date.now(), title: name, color: colors[Math.floor(Math.random() * colors.length)], progress: 0, cards: [] }; columnsData.splice(columnsData.length - 1, 0, newCol); renderBoard(); showToast(`Categoria "${name}" criada!`, 'success'); }
function launchConfetti() { const container = document.getElementById('confettiContainer'); const colors = ['#6c5ce7', '#fd79a8', '#fdcb6e', '#00cec9', '#a29bfe', '#55efc4', '#00d4aa', '#fff']; for (let i = 0; i < 60; i++) { const piece = document.createElement('div'); piece.className = 'confetti'; piece.style.left = Math.random() * 100 + '%'; piece.style.top = '-10px'; piece.style.background = colors[Math.floor(Math.random() * colors.length)]; piece.style.width = Math.random() * 8 + 4 + 'px'; piece.style.height = Math.random() * 8 + 4 + 'px'; piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px'; piece.style.animationDuration = Math.random() * 2 + 2 + 's'; piece.style.animationDelay = Math.random() * 0.5 + 's'; container.appendChild(piece); setTimeout(() => piece.remove(), 4000); } }
function showToast(message, type = 'success') { const container = document.getElementById('toastContainer'); const toast = document.createElement('div'); toast.className = `toast toast-${type}`; const icon = type === 'success' ? '✓' : type === 'warning' ? '⚠' : 'ℹ'; toast.innerHTML = `<div class="toast-icon">${icon}</div><span>${message}</span>`; container.appendChild(toast); setTimeout(() => toast.remove(), 3000); }
function updateStats() { let done = 0, progress = 0, pending = 0; columnsData.forEach(col => { col.cards.forEach(card => { if (card.status === 'done') done++; else if (card.status === 'progress') progress++; else pending++; }); }); document.getElementById('doneCount').textContent = done; document.getElementById('progressCount').textContent = progress; document.getElementById('pendingCount').textContent = pending; }
function filterCards() { const query = document.getElementById('searchInput').value.toLowerCase(); document.querySelectorAll('.card').forEach(card => { const title = card.querySelector('.card-title').textContent.toLowerCase(); const desc = card.querySelector('.card-desc')?.textContent.toLowerCase() || ''; const tags = [...card.querySelectorAll('.tag')].map(t => t.textContent.toLowerCase()).join(' '); const match = title.includes(query) || desc.includes(query) || tags.includes(query); card.style.display = match ? '' : 'none'; }); }
function exportBoard() { const data = { project: 'TFS creature-sharedptr-final', sha: 'e7d5dc7', date: new Date().toISOString(), columns: columnsData.map(col => ({ title: col.title, progress: col.progress, cards: col.cards.map(c => ({ title: c.title, status: c.status, file: c.file, tags: c.tags }))) }) }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `tfs-tracker-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url); showToast('Board exportado! 📊', 'success'); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); document.getElementById('searchInput').focus(); } });
document.addEventListener('DOMContentLoaded', () => { renderBoard(); showToast('TFS Tracker carregado! • SHA: e7d5dc7', 'info'); });
</script>
</body>
